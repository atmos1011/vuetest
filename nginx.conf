server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # This is a single page app: the router handles /poll/abc123 in the browser,
    # and no such file exists on disk. Without this, opening a share link
    # directly would return 404 instead of loading the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
